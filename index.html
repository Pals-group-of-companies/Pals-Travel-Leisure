<style>
:root{
  --bg:#FFFFFF; --soft:#F4F4F5; --card:#FFFFFF; --ink:#1F2124; --muted:#5E6165; --line:#E8E9EB; --red:#0F2D52;--accent:#E61E28; --red2:#0A2242; --tint:#E8EEF7;
  --ok:#1E7A44; --oktint:#E3F3EA; --warn:#9A6200; --warntint:#FFF4D6; --input:#FFFFFF; --shadow:0 18px 50px rgba(20,22,24,.10);
  color-scheme: light;
}
html,:root[data-theme]{color-scheme:light;background:#fff}
html{color:#1F2124}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(90px + env(safe-area-inset-top,0px));scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--ink)} a:hover{color:var(--red2)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #1F6FD1;outline-offset:2px}
img{max-width:100%}
h1,h2,h3{letter-spacing:-.035em;line-height:1.08;margin:0;font-weight:800}
p{margin:0}
.wrap{max-width:1200px;margin:0 auto;padding:0 clamp(18px,4.5vw,32px)}
.muted{color:var(--muted)}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
.h2{font-size:clamp(30px,3.8vw,48px)}
.lead{font-size:clamp(16px,1.6vw,18px);color:var(--muted);line-height:1.65}
.center{text-align:center} .center .lead{margin-left:auto;margin-right:auto}
.sec{padding:clamp(64px,9vw,104px) 0}
.sec.soft{background:var(--soft)}
.view-home .sec.soft{background:#fff}
.head{max-width:720px;margin:0 auto 44px;text-align:center} .head .lead{margin-top:14px}
/* nav */
.navwrap{position:sticky;top:0;z-index:30;padding:14px clamp(12px,3vw,24px);transition:padding .3s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--soft)}
.nav{width:fit-content;max-width:100%;margin:0 auto;display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 18px;box-shadow:0 6px 24px rgba(20,22,24,.08);transition:box-shadow .3s}
.navwrap.scrolled .nav{box-shadow:0 10px 34px rgba(20,22,24,.14)}
.logo{display:inline-flex;align-items:center;padding-right:12px;margin-right:2px;border-right:1px solid var(--line)}
.logo img{height:28px;width:auto;display:block}
.links{display:flex;gap:0}
.links a{min-height:44px;display:inline-flex;align-items:center;padding:0 12px;border-radius:999px;text-decoration:none;font-size:14px;font-weight:500;color:var(--ink);transition:background .2s,color .2s;white-space:nowrap}
.links a:hover{background:var(--soft)}
.links a[aria-current="page"]{background:var(--tint);color:var(--red2);font-weight:700}
.navright{display:flex;gap:8px;align-items:center;margin-left:4px}
.burger{display:none;width:44px;height:44px;border-radius:999px;border:0;background:var(--soft);cursor:pointer;place-items:center}
.mpanel{display:none;max-width:420px;margin:8px auto 0;background:#fff;border:1px solid var(--line);border-radius:24px;padding:8px 16px 14px;box-shadow:0 10px 34px rgba(20,22,24,.12)}
@media (max-width:980px){ .nav{width:100%;justify-content:space-between} .links,.navright .btn-nav{display:none} .burger{display:grid} .mpanel.open{display:block} }
.mpanel a{display:flex;align-items:center;min-height:50px;padding:0 6px;border-bottom:1px solid var(--line);text-decoration:none;font-weight:600;font-size:17px}
.mpanel a:last-child{border-bottom:0}
.mpanel a[aria-current="page"]{color:var(--red2)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 24px;border-radius:999px;border:0;background:var(--red);color:#fff;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;transition:transform .2s,box-shadow .2s,background .2s;white-space:nowrap}
.btn:hover{color:#fff;transform:translateY(-1px);box-shadow:0 10px 24px rgba(15,45,82,.28)}
.btn:active{transform:translateY(0)}
.btn .arr{width:32px;height:32px;margin-right:-14px;border-radius:999px;background:#fff;color:var(--red);display:grid;place-items:center;transition:transform .25s}
.btn:hover .arr{transform:translateX(3px) rotate(-45deg)}
.btn.line{background:var(--card);color:var(--ink);border:1px solid var(--line)} .btn.line:hover{box-shadow:var(--shadow)}
.btn.sm{min-height:42px;padding:0 16px;font-size:14px}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}
.btn-nav{min-height:44px}
.ic{width:20px;height:20px;flex:0 0 auto}
/* icon tiles: duotone */
.tile{position:relative;width:56px;height:56px;border-radius:18px;background:var(--tint);display:grid;place-items:center;color:var(--red);flex:0 0 auto;overflow:hidden}
.tile::before{content:"";position:absolute;width:34px;height:34px;border-radius:999px;background:color-mix(in srgb,var(--red) 16%,transparent);right:-8px;bottom:-8px}
.tile svg{position:relative;width:26px;height:26px}
.itile{width:var(--s);height:var(--s);border-radius:calc(var(--s) * .3);background:var(--tint);display:grid;place-items:center;flex:0 0 auto;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.itile img{width:60%;height:60%;object-fit:contain}
.itile.ivec{color:var(--red)} .itile.ivec svg{width:48%;height:48%}
.feature:hover .itile{transform:rotate(-4deg) scale(1.06)}
.tile.solid{background:var(--red);color:#fff} .tile.solid::before{background:rgba(255,255,255,.18)}


/* hero v4 */
.hero4{position:relative;text-align:center;padding:clamp(64px,10vw,132px) 0 clamp(56px,8vw,96px);overflow:hidden;isolation:isolate}
.hero4::before{content:"";position:absolute;inset:0;z-index:-1;background-image:radial-gradient(rgba(20,22,24,.09) 1px,transparent 1.2px);background-size:22px 22px;-webkit-mask-image:radial-gradient(60% 55% at 50% 42%,#000 20%,transparent 75%);mask-image:radial-gradient(60% 55% at 50% 42%,#000 20%,transparent 75%)}
.hero4::after{content:"";position:absolute;left:50%;top:38%;width:min(900px,120vw);aspect-ratio:1;transform:translate(-50%,-50%);z-index:-1;background:radial-gradient(closest-side,rgba(15,45,82,.13),rgba(15,45,82,0));pointer-events:none}
.hero4 .kick{display:inline-flex;align-items:center;gap:10px;padding:7px 16px 7px 8px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13.5px;font-weight:600;color:#3A3D40;box-shadow:0 8px 24px -16px rgba(20,22,24,.3)}
.hero4 .kick i{font-style:normal;background:var(--red);color:#fff;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800}
.hero4 h1{font-size:clamp(46px,8vw,118px);letter-spacing:-.062em;line-height:.96;max-width:1080px;margin:28px auto 0;font-weight:800}
.hero4 h1 span{display:block;color:var(--red)}
.hero4 .lead{margin:26px auto 0;max-width:600px;font-size:clamp(17px,1.6vw,20px)}
.planner{margin:clamp(36px,5vw,52px) auto 0;max-width:880px;background:#fff;border:1px solid var(--line);border-radius:28px;padding:10px;display:grid;grid-template-columns:1.35fr 1fr 1fr auto;align-items:stretch;box-shadow:0 40px 80px -40px rgba(20,22,24,.35),0 2px 6px rgba(20,22,24,.04);text-align:start}
.planner label{display:flex;flex-direction:column;justify-content:center;gap:3px;padding:10px 20px;border-radius:20px;cursor:pointer;transition:background .2s;min-width:0}
.planner label:hover{background:#F6F6F7}
.planner label+label{position:relative}
.planner label+label::before{content:"";position:absolute;left:0;top:22%;bottom:22%;width:1px;background:var(--line)}
[dir="rtl"] .planner label+label::before{left:auto;right:0}
.planner small{font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.planner select,.planner input{appearance:none;-webkit-appearance:none;border:0;background:transparent;font:inherit;font-size:16px;font-weight:700;color:var(--ink);padding:2px 0;outline:none;width:100%;min-width:0;cursor:pointer}
.planner input::-webkit-calendar-picker-indicator{opacity:.5;cursor:pointer}
.planner .go{min-height:64px;padding:0 26px 0 30px;border-radius:20px;font-size:16px}
@media (max-width:820px){.planner{grid-template-columns:1fr 1fr;padding:8px;border-radius:24px}.planner label:first-child{grid-column:1/-1}.planner label+label::before{display:none}.planner label{border:1px solid var(--line);margin:4px;border-radius:16px}.planner .go{grid-column:1/-1;margin:4px;justify-content:center}}
.assure{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 26px;margin-top:24px;font-size:14px;font-weight:600;color:#55585B}
.assure span{display:inline-flex;align-items:center;gap:8px}
.assure .ic{width:17px;height:17px;color:var(--red)}
@media (max-width:640px){.hero4{padding:36px 0 56px}.hero4 h1{margin-top:22px}.hero4 .lead{margin-top:20px}}
html[lang="ru"] .hero4 h1{font-size:clamp(42px,6.6vw,96px)}

.planner .pfield{display:flex;flex-direction:column;justify-content:center;gap:3px;padding:10px 20px;border-radius:20px;position:relative;min-width:0}
.planner .pfield::before{content:"";position:absolute;left:0;top:22%;bottom:22%;width:1px;background:var(--line)}
[dir="rtl"] .planner .pfield::before{left:auto;right:0}
.pstep{display:flex;align-items:center;gap:10px}
.pstep button{width:32px;height:32px;flex:0 0 32px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--ink);transition:border-color .2s,color .2s}
.pstep button:hover{border-color:var(--red);color:var(--red)}
.pstep button .ic{width:14px;height:14px}
.planner .pstep input{width:34px;text-align:center;-moz-appearance:textfield;cursor:text}
.planner .pstep input::-webkit-inner-spin-button,.planner .pstep input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.planner input[type=date]{min-height:24px}
.planner input[type=date]::-webkit-date-and-time-value{text-align:start}
@media (max-width:820px){.planner .pfield{border:1px solid var(--line);margin:4px;border-radius:16px}.planner .pfield::before{display:none}}
/* centred request forms */
.drawer.modal{justify-content:center;align-items:center;padding:clamp(0px,3vw,32px)}
.drawer.modal .sheet{width:min(680px,100%);height:auto;max-height:min(92vh,100%);border-radius:30px;box-shadow:0 50px 120px -40px rgba(0,0,0,.5);padding:26px clamp(20px,4vw,44px) 34px;animation:rise .38s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(24px) scale(.98);opacity:0}}
.drawer.modal .sheet>.row{justify-content:flex-end}
.drawer.modal .sheet>.row .meta{display:none}
.drawer.modal .formhead{flex-direction:column;text-align:center;gap:12px;margin-bottom:10px}
.drawer.modal .formhead h3{font-size:clamp(24px,3vw,30px)!important;letter-spacing:-.035em}
.drawer.modal .formhead .note{max-width:440px;margin:6px auto 0}
.drawer.modal .btn[type=submit]{width:100%;justify-content:center}
@media (max-width:640px){.drawer.modal{padding:0;align-items:flex-end}.drawer.modal .sheet{max-height:94vh;border-radius:26px 26px 0 0}}
/* partner band without boxes */
.pband .ptile{background:transparent;border:0;box-shadow:none;min-width:0;padding:0 30px;height:88px}
.pband .ptile:hover{transform:none;box-shadow:none}
.pband{background:#fff;padding-top:clamp(28px,4vw,40px)}.pband .ptrack{background:#fff}
.pband .ptile img{mix-blend-mode:multiply;max-height:60px;max-width:150px;transition:transform .3s}
.pband .ptile:hover img{transform:scale(1.06)}
/* ambassadors */
.amb{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:28px}
@media (max-width:900px){.amb{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.amb{grid-template-columns:1fr}}
.amb div{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px}
.amb b{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--red);color:#fff;font-size:14px}
.amb h3{font-size:18px;margin-top:14px;letter-spacing:-.02em}
.amb p{font-size:14.5px;color:var(--muted);margin-top:6px}
/* image-free home */
.hero3{position:relative;text-align:center;padding:clamp(56px,9vw,120px) 0 clamp(40px,6vw,72px);overflow:hidden}
.hero3::before{content:"";position:absolute;inset:-30% -10% auto;height:120%;background:radial-gradient(48% 42% at 50% 38%,rgba(15,45,82,.10),rgba(15,45,82,0) 70%);pointer-events:none;z-index:0}
.hero3 .wrap{position:relative;z-index:1}
.hero3 h1{font-size:clamp(44px,7.4vw,108px);letter-spacing:-.058em;line-height:.98;max-width:1000px;margin:24px auto 0}
.hero3 h1 span{color:var(--red);display:block}
.hero3 .lead{margin:24px auto 0;max-width:620px}
.hero3 .ctas{justify-content:center}
.route{display:block;width:min(820px,100%);height:auto;margin:clamp(30px,5vw,48px) auto 0;color:var(--red)}
.route .ln{stroke-dasharray:4 7;animation:dash 22s linear infinite}
@keyframes dash{to{stroke-dashoffset:-220}}
.route text{font:700 11px 'Plus Jakarta Sans','Noto Sans Arabic',sans-serif;fill:#6B6E71;letter-spacing:.08em;text-transform:uppercase}
.intent{margin:clamp(30px,5vw,44px) auto 0;max-width:900px}
.intent p{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;margin-bottom:14px}
.intent .row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.intent button{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:#fff;font:inherit;font-weight:600;font-size:14.5px;color:var(--ink);cursor:pointer;transition:border-color .25s,color .25s,transform .25s,box-shadow .25s}
.intent button .ic{width:18px;height:18px;color:var(--red)}
.intent button:hover{border-color:var(--red);color:var(--red2);transform:translateY(-2px);box-shadow:0 10px 24px -14px rgba(15,45,82,.5)}
.stats3{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));max-width:900px;margin:clamp(40px,6vw,64px) auto 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stats3 div{padding:22px 12px}
.stats3 div+div{border-left:1px solid var(--line)}
[dir="rtl"] .stats3 div+div{border-left:0;border-right:1px solid var(--line)}
.stats3 b{display:block;font-size:clamp(24px,3vw,34px);letter-spacing:-.045em;line-height:1.1}
.stats3 span{font-size:13px;color:var(--muted);font-weight:600}
@media (max-width:640px){.stats3{grid-template-columns:1fr 1fr}.stats3 div:nth-child(3){border-left:0}.stats3 div:nth-child(n+3){border-top:1px solid var(--line)}[dir="rtl"] .stats3 div:nth-child(3){border-right:0}}
.ptile.txt{min-width:0;padding:0 26px;background:transparent;border:0;height:56px}
.ptile.txt span{font-size:16px;color:#8A8D90;font-weight:700}
.ptrack.txt{gap:6px}
.ptrack.txt .ptile+.ptile::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--red);opacity:.5;margin-right:32px;display:inline-block;vertical-align:middle}
.ptile.txt{display:flex;align-items:center}
.dgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:clamp(28px,4vw,40px)}
@media (max-width:1000px){.dgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.dgrid{grid-template-columns:1fr}}

.dbox .ctry{position:absolute;top:22px;right:22px;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 10px}
[dir="rtl"] .dbox .ctry{right:auto;left:22px}

.dbox.feat .ctry{color:#fff;border-color:rgba(255,255,255,.45)}

@media (max-width:520px){.why2{grid-template-columns:1fr}}
.why2 div{padding:28px 24px 8px 0}
[dir="rtl"] .why2 div{padding:28px 0 8px 24px}
.why2 b{font-size:13px;font-weight:800;color:var(--red);letter-spacing:.06em}
.why2 h3{font-size:20px;letter-spacing:-.03em;margin-top:10px}
.why2 p{font-size:15px;color:var(--muted);margin-top:8px}
.tlist{display:grid;gap:12px;margin-top:clamp(24px,4vw,36px)}
.trow{display:grid;grid-template-columns:auto 1fr auto auto;gap:20px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px 18px 18px 24px;text-align:left;font:inherit;color:inherit;cursor:pointer;transition:border-color .3s,box-shadow .3s,transform .3s}
[dir="rtl"] .trow{text-align:right;padding:18px 24px 18px 18px}
.trow:hover{border-color:rgba(15,45,82,.35);transform:translateY(-2px);box-shadow:0 18px 40px -26px rgba(20,22,24,.35)}
.trow .d{font-size:12.5px;font-weight:700;color:var(--red2);background:rgba(15,45,82,.08);border-radius:999px;padding:6px 12px;white-space:nowrap}
.trow h3{font-size:18px;letter-spacing:-.025em}
.trow small{display:block;font-size:13.5px;color:var(--muted);margin-top:2px}
.trow .pr{font-size:14px;color:var(--muted);white-space:nowrap}

@media (max-width:700px){.trow{grid-template-columns:1fr auto;gap:10px 14px}.trow .d{grid-column:1/-1;justify-self:start}.trow .pr{grid-column:1/2}}
/* hero */
.hero{text-align:center;padding:clamp(36px,6vw,72px) 0 0}
.badge{display:inline-flex;align-items:center;gap:10px;padding:6px 16px 6px 6px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600}
.badge b{padding:4px 10px;border-radius:999px;background:var(--red);color:#fff;font-size:12px}
.hero h1{font-size:clamp(46px,8vw,120px);letter-spacing:-.055em;line-height:1.02;margin-top:24px}
.hero h1 span{color:var(--red)}
.hero .lead{max-width:560px;margin:22px auto 0}
.ctas{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:30px}
.stage{position:relative;max-width:760px;margin:12px auto 0;height:clamp(170px,26vw,320px)}
.stage svg.route{position:absolute;left:0;top:32%;width:100%;height:55%;overflow:visible}
.route path{stroke-dasharray:2 10;animation:dash 30s linear infinite}
@keyframes dash{to{stroke-dashoffset:-600}}
.jet{position:absolute;left:50%;top:0;width:min(86%,560px);transform:translateX(-50%);filter:drop-shadow(0 30px 28px rgba(20,22,24,.18));animation:fly 7s ease-in-out infinite}
@keyframes fly{0%,100%{transform:translateX(-50%) translateY(0) rotate(-1.5deg)}50%{transform:translateX(-50%) translateY(-16px) rotate(.5deg)}}
.strip{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px;margin-top:24px;padding:18px 0 28px;border-top:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(290px,100%),1fr));gap:20px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden;display:flex;flex-direction:column;transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.media{aspect-ratio:4/3;background:var(--soft);position:relative;display:grid;place-items:center;overflow:hidden}
.media img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.card:hover .media img{transform:scale(1.05)}
.media img.contain{object-fit:contain;width:86%;height:78%}
.chip-abs{position:absolute;top:12px;left:12px;background:#fff;color:#1F2124;font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px}
.cbody{padding:18px 20px 20px;display:flex;flex-direction:column;gap:6px;flex:1}
.meta{font-size:13px;color:var(--muted);font-weight:600}
.cbody h3{font-size:19px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cfoot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
.price{font-weight:800}
.panel{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:clamp(20px,3vw,30px)}
.feature{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px;transition:transform .35s,box-shadow .35s}
.feature:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.feature h3{font-size:18px;margin:18px 0 6px} .feature p{font-size:15px;color:var(--muted)}
.split{display:flex;flex-wrap:wrap;gap:40px 64px;align-items:center}
.split>*{flex:1 1 min(420px,100%)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 28px}
.chip{min-height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14px;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.chip[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.logos{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:24px 56px}
.logos img{height:46px;width:auto}
.logos img:hover{filter:none;opacity:1}
.stat{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px}
.stat b{display:block;font-size:clamp(34px,4vw,48px);letter-spacing:-.05em;line-height:1}
.stat.red{background:var(--red);border-color:var(--red);color:#fff}
.pagehead{text-align:center;padding:clamp(40px,7vw,80px) 0 clamp(32px,5vw,56px)}
.pagehead h1{font-size:clamp(40px,6.4vw,84px);letter-spacing:-.05em}
.pagehead .lead{max-width:600px;margin:16px auto 0}
.crumb{font-size:13px;color:var(--muted);margin-bottom:14px}
.cover{border-radius:28px;overflow:hidden;aspect-ratio:21/8;background:var(--soft)} .cover img{width:100%;height:100%;object-fit:cover;display:block;animation:kb 26s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.1)}}
.list{list-style:none;margin:0;padding:0} .list li{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.pill{display:inline-flex;align-items:center;min-height:28px;padding:0 10px;border-radius:999px;background:var(--tint);color:var(--red2);font-size:12px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--oktint);color:var(--ok)} .pill.warn{background:var(--warntint);color:var(--warn)} .pill.grey{background:var(--soft);color:var(--muted)}
details{border-bottom:1px solid var(--line);padding:18px 2px} summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:12px} summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:22px;line-height:1;color:var(--red);transition:transform .25s} details[open] summary::after{transform:rotate(45deg)}
details p{margin-top:10px;color:var(--muted);font-size:15px}
/* forms */
.form{display:grid;gap:14px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.in{min-height:48px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:var(--input);width:100%;transition:border-color .2s,box-shadow .2s}
.in:focus{border-color:var(--red);box-shadow:0 0 0 4px var(--tint);outline:none}
textarea.in{padding:12px 14px;min-height:96px;resize:vertical}
fieldset{border:0;margin:0;padding:0} legend{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:8px;padding:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative;display:inline-flex;align-items:center;min-height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;color:var(--ink)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt:has(input:checked){background:var(--tint);border-color:var(--red);color:var(--red2)}
.opt:has(input:focus-visible){outline:3px solid #1F6FD1;outline-offset:2px}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:12px;padding:5px 5px 5px 14px;font-weight:600;font-size:14px;background:var(--input)}
.stepper .ctrl{display:flex;align-items:center;gap:8px}
.stepper button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:18px;display:grid;place-items:center}
.stepper input{width:44px;text-align:center;border:0;background:transparent;font-weight:800;-moz-appearance:textfield}
.stepper input::-webkit-inner-spin-button{display:none}
.formhead{display:flex;gap:14px;align-items:center;margin-bottom:4px}
.note{font-size:13px;color:var(--muted)}
.success{text-align:center;padding:24px 8px}
.success .tick{width:72px;height:72px;border-radius:999px;background:var(--tint);color:var(--red);display:grid;place-items:center;margin:0 auto;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
/* drawer */
.drawer{position:fixed;inset:0;z-index:50;background:rgba(10,10,12,.45);display:flex;justify-content:flex-end;animation:fade .25s}
.sheet{width:min(600px,100%);height:100%;overflow:auto;background:var(--bg);padding:22px clamp(18px,3vw,30px) calc(30px + env(safe-area-inset-bottom,0px));animation:slide .35s cubic-bezier(.2,.8,.2,1)}
@keyframes fade{from{opacity:0}} @keyframes slide{from{transform:translateX(40px);opacity:0}}
/* detail */
.detail{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start;margin:20px 0 80px}
.detail .main{flex:999 1 min(560px,100%);min-width:0}
.detail aside{flex:1 1 min(340px,100%);max-width:460px;position:sticky;top:96px}
@media (max-width:800px){.detail aside{position:static;max-width:none}}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:10px;margin-bottom:22px}
.gallery img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:18px;display:block}
/* admin */
.admin{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start;margin:8px 0 80px}
.side{flex:0 0 230px;max-width:100%;display:flex;flex-direction:column;gap:4px}
.side button{display:flex;align-items:center;gap:10px;min-height:46px;padding:0 14px;border-radius:12px;border:0;background:transparent;font-weight:600;cursor:pointer;text-align:left;color:var(--ink)}
.side button[aria-current="page"]{background:var(--tint);color:var(--red2)}
.side .count{margin-left:auto;font-size:12px;color:var(--muted)}
.amain{flex:1 1 min(600px,100%);min-width:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(160px,100%),1fr));gap:12px;margin-bottom:18px}
.tablewrap{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:780px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:12px 14px}
td{padding:10px 14px;border-top:1px solid var(--line);vertical-align:middle}
.thumb{width:58px;height:44px;border-radius:9px;object-fit:cover;background:var(--soft);display:block}
.bar{height:10px;border-radius:999px;background:var(--red);transition:width .8s cubic-bezier(.2,.7,.2,1)}
.track{background:var(--soft);border-radius:999px;height:10px}
.imgs{display:flex;flex-wrap:wrap;gap:8px} .imgs figure{margin:0;position:relative}
.imgs img{width:100px;height:76px;object-fit:cover;border-radius:10px;display:block;background:var(--soft)}
.imgs button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:999px;border:0;background:#fff;color:#C3141D;cursor:pointer;font-weight:800}
dl.kv{margin:0;display:grid;grid-template-columns:minmax(120px,38%) 1fr;gap:10px 16px} dl.kv dt{color:var(--muted);font-size:14px} dl.kv dd{margin:0;font-weight:600;word-break:break-word}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:60;animation:pop .3s}

.footer{background:var(--soft);padding:24px clamp(10px,2vw,24px)}
.fcard{max-width:1320px;margin:0 auto;background:var(--card);border-radius:32px;overflow:hidden}
.fnews{display:flex;flex-wrap:wrap;gap:20px 40px;align-items:center;justify-content:space-between;padding:clamp(28px,5vw,52px);border-bottom:1px solid var(--line)}

.fnews form{display:flex;gap:8px;flex-wrap:wrap;flex:1 1 min(380px,100%)}
.fcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(170px,100%),1fr));gap:32px;padding:clamp(28px,5vw,52px)}
.fcols .brand{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:16px 40px;align-items:center;justify-content:space-between}
.fcols h4{margin:0 0 12px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fcols a{display:block;padding:5px 0;text-decoration:none}
.soc{display:flex;gap:8px} .soc a{width:44px;height:44px;border-radius:999px;border:1px solid var(--line);display:grid;place-items:center;padding:0;transition:background .2s}
.soc a:hover{background:var(--tint)}
.wordwrap{position:relative;padding:clamp(28px,5vw,52px) clamp(16px,4vw,52px) 0;text-align:center;overflow:hidden}
.wordtag{font-size:13px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.wordmark{margin:0;font-size:clamp(56px,15vw,230px);line-height:.88;letter-spacing:-.065em;font-weight:800;white-space:nowrap;color:var(--red);background-size:cover;background-position:50% 60%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:pan 22s ease-in-out infinite alternate;filter:saturate(1.15) contrast(1.05)}
@keyframes pan{from{background-position:30% 40%}to{background-position:70% 70%}}
.wordline{height:1px;background:linear-gradient(90deg,transparent,var(--red),transparent);opacity:.35;margin:18px auto 0;max-width:640px}
/* marquee */
.marquee{overflow:hidden;padding:0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}

.mtrack{gap:26px;padding:34px 13px 46px}
.pc{margin:0;flex:0 0 auto;width:clamp(230px,23vw,300px);background:#fff;border-radius:26px;padding:10px 10px 14px;position:relative;box-shadow:0 1px 2px rgba(20,22,24,.06),0 12px 24px -6px rgba(20,22,24,.14),0 30px 60px -18px rgba(20,22,24,.22);transform:rotate(var(--r)) translateY(var(--y));transition:transform .5s cubic-bezier(.2,.8,.2,1),box-shadow .5s}

.pcprice{font-size:13px;color:var(--muted);padding:0 6px 10px}.pcprice strong{color:var(--ink)}

.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr));gap:16px}
/* hero */

.hstats{display:flex;flex-wrap:wrap;gap:12px 36px;margin-top:34px;padding-top:24px;border-top:1px solid var(--line)}
.hstats b{display:block;font-size:26px;letter-spacing:-.04em;line-height:1.1}
.hstats span{font-size:13px;color:var(--muted);font-weight:600}
.hphoto{position:relative;margin:0}
.hphoto .frame{border-radius:36px;overflow:hidden;aspect-ratio:4/4.4;box-shadow:0 40px 80px -30px rgba(20,22,24,.35)}
.hphoto .frame img{width:100%;height:100%;object-fit:cover;object-position:58% 50%;display:block;animation:kb 26s ease-in-out infinite alternate}
.hphoto .chip{position:absolute;left:-18px;bottom:28px;background:#fff;border-radius:20px;padding:14px 18px;box-shadow:0 18px 40px rgba(20,22,24,.14);display:flex;gap:12px;align-items:center;max-width:280px}
.hphoto .chip .tile{width:44px;height:44px;border-radius:14px} .hphoto .chip .tile svg{width:22px;height:22px}
.hphoto .chip b{display:block;font-size:14px} .hphoto .chip span{font-size:12.5px;color:var(--muted)}
@media (max-width:900px){.hphoto .chip{left:12px}}
/* partners marquee */
.pband{padding:8px 0 clamp(40px,6vw,64px)}
.pband p{text-align:center;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:18px}
.ptrack{display:flex;gap:14px;width:max-content;animation:marq 55s linear infinite}
.pband .marquee:hover .ptrack{animation-play-state:paused}
.ptile{flex:0 0 auto;height:96px;min-width:170px;padding:0 24px;border-radius:18px;background:#fff;border:1px solid var(--line);display:grid;place-items:center}
.ptile img{max-height:66px;max-width:170px;width:auto;object-fit:contain}
.ptile{transition:transform .3s,box-shadow .3s}.ptile:hover{transform:translateY(-3px);box-shadow:0 14px 30px -18px rgba(20,22,24,.3)}
.ptile span{font-size:14px;font-weight:700;color:#55585B;letter-spacing:-.01em;white-space:nowrap}
/* destination cards */
.dtrack{display:flex;gap:22px;width:max-content;padding:20px 11px 30px;animation:marq 70s linear infinite}
.marquee:hover .dtrack{animation-play-state:paused}
.dcard{flex:0 0 auto;width:clamp(220px,21vw,280px);margin:0;cursor:pointer;background:none;border:0;padding:0;text-align:left;font:inherit;color:inherit}

.dcard .dimg{position:relative;aspect-ratio:4/5;border-radius:26px;overflow:hidden;box-shadow:0 26px 50px -24px rgba(20,22,24,.45)}

.dcard .dimg img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1s cubic-bezier(.2,.8,.2,1)}
.dcard:hover .dimg img{transform:scale(1.06)}
.dcard .dmeta{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:16px 6px 0}
.dcard .dmeta b{font-size:20px;letter-spacing:-.03em}
.dcard .dmeta i{font-style:normal;font-size:12px;font-weight:700;color:var(--red2);text-transform:uppercase;letter-spacing:.08em}
.dcard .dsub{padding:4px 6px 0;font-size:14px;color:var(--muted)}
/* confidence */
.conf{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:16px}
.care{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:4px 28px;margin-top:28px}
.care li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);font-size:15px}
.care li svg{color:var(--red);flex:0 0 auto;margin-top:2px}
/* language menu */
.lang{position:relative}
.langbtn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border-radius:999px;border:0;background:var(--soft);cursor:pointer;font-weight:700;font-size:13px;color:var(--ink)}
.langmenu{position:absolute;right:0;top:calc(100% + 8px);background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 40px rgba(20,22,24,.14);padding:6px;min-width:170px;display:none;z-index:40}
.langmenu.open{display:block}
.langmenu button{display:flex;justify-content:space-between;width:100%;min-height:42px;padding:0 12px;border:0;border-radius:10px;background:none;cursor:pointer;font-size:14px;color:var(--ink)}
.langmenu button:hover,.langmenu button[aria-checked="true"]{background:var(--tint);color:var(--red2)}
[dir="rtl"] .langmenu{right:auto;left:0}
[dir="rtl"] body{font-family:'Noto Sans Arabic','Plus Jakarta Sans',system-ui,sans-serif}
[dir="rtl"] h1,[dir="rtl"] h2,[dir="rtl"] h3{letter-spacing:0}
[dir="rtl"] .btn .arr{margin-right:0;margin-left:-14px;transform:scaleX(-1)}
[dir="rtl"] .hphoto .chip{left:auto;right:-18px}
[dir="rtl"] .feature,[dir="rtl"] .dcard{text-align:right}
html[lang="zh"] body{font-family:'Plus Jakarta Sans','PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif}
html[lang="zh"] h1,html[lang="zh"] h2,html[lang="zh"] h3{letter-spacing:0}
/* numbered business blocks */
.ways{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width:1000px){.ways{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.ways{grid-template-columns:1fr}}
.way{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:26px}
.way .n{font-size:40px;font-weight:800;letter-spacing:-.05em;color:var(--red);line-height:1}
.way h3{font-size:19px;margin:16px 0 6px}.way p{font-size:15px;color:var(--muted)}
.handle{border-top:1px solid var(--line)}
.handle div{display:grid;grid-template-columns:minmax(160px,240px) 1fr;gap:8px 28px;padding:16px 0;border-bottom:1px solid var(--line)}
.handle b{font-size:15px} .handle span{font-size:15px;color:var(--muted)}
@media (max-width:640px){.handle div{grid-template-columns:1fr}}
.mice{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:16px}
.mice .way .n{width:56px;height:56px;border-radius:16px;background:var(--red);color:#fff;display:grid;place-items:center;font-size:26px}
.prog li{display:grid;grid-template-columns:110px 1fr;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
.prog li b{color:var(--red2);font-size:13px;letter-spacing:.06em;text-transform:uppercase}
/* reveal */
.reveal{opacity:0;transform:translateY(22px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1)}
.reveal.is-in{opacity:1;transform:none}
.view{animation:viewin .45s cubic-bezier(.2,.7,.2,1)}
@keyframes viewin{from{opacity:0;transform:translateY(10px)}}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} .reveal{opacity:1;transform:none} html{scroll-behavior:auto} }

/* icons in black */
:root{--icon:#1F2124;--itint:#F1F1F2}
.tile{background:var(--itint);color:var(--icon)}
.tile::before{background:rgba(20,22,24,.06)}
.itile{background:var(--itint)}
.itile.ivec{color:var(--icon)}
.care li svg,.assure .ic,.intent button .ic{color:var(--icon)}
.success .tick{background:var(--itint);color:var(--icon)}
.btn .arr{color:var(--icon)}
.dbox .go .ic,.feature p .ic,.trow>.arr{color:var(--icon)}
.dbox.feat .go .ic{color:#fff}
.btn.line .ic,.langbtn .ic{color:var(--icon)}

/* pictograms */
.pic{width:56%;height:56%;display:block}
.tile .pic{width:30px;height:30px;position:relative}
.itile.ivec .pic{width:52%;height:52%}
/* pinned notes */
.board{margin-top:20px;background:#fff;border:1px solid var(--line);border-radius:28px;padding:clamp(24px,4vw,40px);background-image:radial-gradient(rgba(20,22,24,.06) 1px,transparent 1.2px);background-size:18px 18px}
.board h3{text-align:center;font-size:clamp(20px,2.4vw,26px);letter-spacing:-.03em}
.pins{list-style:none;padding:0;margin:clamp(28px,4vw,40px) 0 0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px 22px}
@media (max-width:900px){.pins{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.pins{grid-template-columns:1fr}}
.pnote{position:relative;background:#FFFEF8;border-radius:6px;padding:34px 22px 22px;transform:rotate(var(--r,0deg));box-shadow:0 1px 1px rgba(0,0,0,.06),0 14px 26px -16px rgba(20,22,24,.45),0 2px 0 rgba(0,0,0,.02);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s;text-align:center}
.pnote:hover{transform:rotate(0deg) translateY(-4px);box-shadow:0 1px 1px rgba(0,0,0,.06),0 24px 40px -18px rgba(20,22,24,.45)}
.pnote .pin{position:absolute;top:-30px;left:50%;width:34px;height:50px;transform:translateX(-50%) rotate(12deg);filter:drop-shadow(5px 6px 3px rgba(0,0,0,.22))}
.pnote::after{content:"";position:absolute;top:10px;left:calc(50% + 4px);width:7px;height:4px;border-radius:50%;background:rgba(0,0,0,.18);filter:blur(1px)}
.pnote .nn{display:block;font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--muted)}
.pnote p{margin-top:8px;font-size:15.5px;line-height:1.5;color:var(--ink);font-weight:500}
/* business */
.svcgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.svcgrid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.svcgrid,.svcgrid.four{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.svcgrid,.svcgrid.four{grid-template-columns:1fr}}
.svc{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px 24px;text-align:center;transition:transform .35s,box-shadow .35s}
.svc .tile{margin:0 auto}
.svc h3{font-size:18px;margin:18px 0 8px;letter-spacing:-.02em}
.svc p{font-size:15px;color:var(--muted);line-height:1.55}
.svc:hover{transform:translateY(-4px);box-shadow:0 24px 48px -30px rgba(20,22,24,.35)}
.mice2{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width:1000px){.mice2{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.mice2{grid-template-columns:1fr}}
.mc{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:158px 24px 26px;text-align:center;transition:transform .35s,box-shadow .35s}
.mc .ml{position:absolute;top:22px;left:50%;transform:translateX(-50%);font-size:112px;font-weight:800;line-height:1;letter-spacing:-.06em;color:transparent;-webkit-text-stroke:1.5px var(--ink);opacity:.9}
.mc::before{content:"";position:absolute;top:140px;left:50%;width:36px;height:3px;border-radius:3px;background:var(--red);transform:translateX(-50%)}
.mc h3{font-size:20px;letter-spacing:-.03em;margin-top:8px}
.mc p{font-size:15px;color:var(--muted);margin-top:8px;line-height:1.55}
.mc:hover{transform:translateY(-4px);box-shadow:0 24px 48px -30px rgba(20,22,24,.35)}
.mc:hover .ml{color:var(--ink)}
.subhead{text-align:center;font-size:clamp(20px,2.4vw,26px);letter-spacing:-.03em;margin-top:clamp(40px,6vw,60px)}
.steps5{list-style:none;padding:0;margin:24px 0 0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;counter-reset:s}
@media (max-width:1000px){.steps5{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.steps5{grid-template-columns:1fr}}
.steps5 li{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 18px;text-align:center}
.steps5 b{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--ink);color:#fff;font-size:15px}
.steps5 p{font-size:14.5px;color:var(--muted);margin-top:12px;line-height:1.55}
.formwrap{max-width:720px;margin:clamp(36px,5vw,56px) auto 0}
.progwrap{max-width:820px;margin:clamp(40px,6vw,64px) auto 0;background:var(--soft);border-radius:28px;padding:clamp(24px,4vw,44px)}
.tl{list-style:none;padding:0;margin:26px 0 0;position:relative}
.tl::before{content:"";position:absolute;left:11px;top:6px;bottom:6px;width:2px;background:var(--line)}
[dir="rtl"] .tl::before{left:auto;right:11px}
.tl li{position:relative;padding:0 0 22px 44px}
[dir="rtl"] .tl li{padding:0 44px 22px 0}
.tl li::before{content:"";position:absolute;left:4px;top:4px;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--ink)}
[dir="rtl"] .tl li::before{left:auto;right:4px}
.tl b{font-size:15px}
.tl p{font-size:15px;color:var(--muted);margin-top:4px}
.center{text-align:center}
/* Microsoft Forms style */
.form{display:flex;flex-direction:column;gap:12px;background:#F3F2F1;border-radius:22px;padding:12px}
.formhead{background:#fff;border-radius:14px;border-top:10px solid var(--red);padding:26px 24px 22px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;margin:0}
.formhead h3{font-size:clamp(22px,2.6vw,28px);letter-spacing:-.035em}
.formhead .note{max-width:460px;margin:6px auto 0;font-size:14px}
.form>.pill.warn{border-radius:12px}
.qreq{font-size:13px;color:#605E5C;padding:2px 6px}
.qs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:12px}
.q{background:#fff;border-radius:12px;padding:20px 22px 22px;display:flex;flex-direction:column;gap:14px;border:1px solid transparent;transition:border-color .2s,box-shadow .2s;min-width:0;margin:0}
.q.wide{grid-column:1/-1}
.q:focus-within{border-color:rgba(15,45,82,.35);box-shadow:0 0 0 3px rgba(15,45,82,.08)}
.qt{display:flex;gap:6px;font-size:15.5px;font-weight:700;color:#252423;line-height:1.4;padding:0;width:100%}
fieldset.q>legend.qt{float:left;margin:0 0 14px}
fieldset.q>.opts{clear:both}
fieldset.q{display:block}
fieldset.q{border:0}
.qn{color:#605E5C;font-weight:600}
.qr{color:var(--red)}
.q .in{border:0;border-bottom:1.5px solid #C8C6C4;border-radius:0;background:transparent;padding:0 2px;min-height:42px;font-size:15px}
.q .in:focus{border-bottom-color:var(--red);box-shadow:none}
.q select.in,.q textarea.in{border:1.5px solid #C8C6C4;border-radius:8px;padding:0 12px}
.q textarea.in{padding:12px;min-height:110px}
.q select.in:focus,.q textarea.in:focus{border-color:var(--red)}
.q .opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(210px,100%),1fr));gap:4px 10px}
.q .opt{border:0;background:transparent;border-radius:8px;min-height:40px;padding:6px 10px;gap:12px;font-weight:500;font-size:15px;color:#252423;justify-content:flex-start}
.q .opt input{position:static;opacity:1;pointer-events:auto;width:19px;height:19px;margin:0;accent-color:var(--red);flex:0 0 auto}
.q .opt:hover{background:#F3F2F1}
.q .opt:has(input:checked){background:#EAF0F8;color:#252423}
.q .stepper{display:inline-flex;align-self:flex-start;align-items:center;gap:10px;border:0;padding:0;background:transparent}
.q .stepper button{width:40px;height:40px;border-radius:50%;border:1.5px solid #C8C6C4;background:#fff}
.q .stepper button:hover{border-color:var(--red);color:var(--red)}
.q .stepper input{width:48px;font-size:18px}
.qsec{background:#fff;border-radius:12px;padding:18px 22px;text-align:center;border-left:0}
.qsec h4{font-size:17px;letter-spacing:-.02em}
.qsec p{font-size:13.5px;color:#605E5C;margin-top:4px}
.qsubmit{display:flex;justify-content:center;padding:8px 0 6px}
.qsubmit .btn{min-width:min(280px,100%);justify-content:center}
.form>[data-err]{text-align:center}
.drawer.modal .sheet{background:#F3F2F1}
.drawer.modal .sheet .form{padding:0;background:transparent}
.panel:has(> .form){padding:0;background:transparent;border:0}
@media (max-width:560px){.q{padding:18px 16px}}

/* contact */
.cways{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width:1000px){.cways{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.cways{grid-template-columns:1fr}}
.cway{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px 18px 24px;text-decoration:none;color:inherit;transition:transform .35s,box-shadow .35s,border-color .35s}
.cway .tile{margin-bottom:10px}
.cway .cl{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.cway strong{font-size:16.5px;letter-spacing:-.01em;word-break:break-word}
.cway .cs{font-size:13.5px;color:var(--muted)}
.cway:hover{transform:translateY(-4px);border-color:rgba(20,22,24,.18);box-shadow:0 24px 48px -30px rgba(20,22,24,.35)}
.kinds{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:980px;margin:0 auto}
.kind{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:#fff;font:inherit;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;transition:all .2s}
.kind .ic{width:17px;height:17px;color:var(--icon)}
.kind:hover{border-color:var(--ink)}
.kind[aria-checked="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.kind[aria-checked="true"] .ic{color:#fff}
.qother{margin-top:4px}

  const LEGAL = {
    privacy: { title: 'Privacy Policy', desc: 'How Pals Travel & Leisure Ltd collects, uses and protects personal data under the Kenya Data Protection Act, 2019.', body: () =>
      lsec('Who we are', '<p>' + CO + ' (“Pals”, “we”, “us”) is a travel company at Nandi Road, Karen, Nairobi, Kenya. We are the data controller for the personal data described here, under the Kenya Data Protection Act, 2019. Contact us about privacy at <a href="mailto:info@palstravelleisure.co.ke">info@palstravelleisure.co.ke</a> or +254 757 129 599.</p>') +
      lsec('What we collect', lul(['<b>Enquiries and bookings:</b> your name, phone or WhatsApp number, email, country, optional company name and website, and the trip details you give us, such as dates, destinations, number of travellers and special requests.',
        '<b>For confirmed bookings:</b> the traveller details our suppliers need, such as names, dates of birth or passport details for flights, park entry or visas. We collect these separately and securely when you book, not through the website forms.',
        '<b>Careers and Pals Ambassadors:</b> your application details, study or work background and any CV link you choose to share.',
        '<b>Newsletter:</b> your email address, if you subscribe.',
        '<b>On your device:</b> your language, currency and cookie choices, stored in your browser. See our <a href="#legal/cookies">Cookie Policy</a>.',
        '<b>Technical data:</b> our hosting provider keeps standard server logs (such as IP address, browser type and pages requested) to keep the site secure and running.'])) +
      lsec('What we do not collect', lul(['We do not ask for medical records, diagnoses, passport numbers or payment card details through this website. Please do not send them in a form.',
        'We do not use analytics, advertising or tracking cookies, and we do not profile visitors or make automated decisions about you.',
        'The website has no chatbot. Some website text is translated with automated translation tools; no personal data is used for this.'])) +
      lsec('Why we use it, and our legal basis', lul(['To reply to your enquiry and prepare a quotation, at your request (steps before a contract) and with your consent given in the form.',
        'To arrange and manage your booking (performance of a contract).',
        'To keep accounting, tax and travel records (legal obligation).',
        'To send our travel offers email, only if you opt in (consent). You can withdraw at any time.',
        'To consider job and Pals Ambassadors applications (your request and consent).',
        'To protect the website and our customers from fraud and spam (legitimate interests).'])) +
      lsec('Who we share it with', '<p>We share only what is needed, and we never sell personal data.</p>' + lul(['<b>Travel suppliers</b> needed for your trip: airlines, hotels, lodges and camps, ground handlers, Kenya Railways (SGR), park authorities and visa or immigration authorities.',
        '<b>Service providers</b> who run parts of our website and email for us: Vercel (website hosting), FormSubmit (delivers website form submissions to our inbox), our email provider, and ExchangeRate-API at open.er-api.com (provides exchange rates when you view prices in a currency other than KES; it receives your IP address but no personal details).',
        '<b>Google</b>, only if you choose to load a map on a hotel page.',
        '<b>WhatsApp (Meta)</b>, if you choose to contact us there.',
        '<b>Authorities</b>, where the law requires it.'])) +
      lsec('Transfers outside Kenya', '<p>Some of our service providers and suppliers are outside Kenya, for example in the United States, the European Union or your destination country. We transfer personal data only where it is needed for the service you asked for or with appropriate safeguards, as required by the Data Protection Act, 2019.</p>') +
      lsec('How long we keep it', lul(['Enquiries that do not become bookings: up to 24 months.', 'Booking, payment and accounting records: for the period Kenyan tax and accounting law requires.', 'Job and Pals Ambassadors applications: up to 12 months, unless you join us or ask us to delete them sooner.', 'Newsletter: until you unsubscribe.'])) +
      lsec('Your rights', '<p>Under the Data Protection Act, 2019 you have the right to be informed about how your data is used, to access it, to have it corrected or deleted, to object to its use, to data portability, and to withdraw consent at any time. If you are in the European Union or the United Kingdom, you have similar rights under the GDPR. To use any of these rights, email <a href="mailto:info@palstravelleisure.co.ke">info@palstravelleisure.co.ke</a>. We may ask you to confirm your identity. You can also complain to the Office of the Data Protection Commissioner (ODPC) at <a href="https://www.odpc.go.ke" target="_blank" rel="noopener">www.odpc.go.ke</a>.</p>') +
      lsec('Children', '<p>Our website forms are meant for adults. For school transport, we collect pupils’ details from their parents, guardians or schools only. The Pals Ambassadors programme is open to people aged 18 and over.</p>') +
      lsec('Security', '<p>The website uses encrypted connections (HTTPS). Access to personal data is limited to staff who need it. If a data breach is likely to put you at risk, we will notify the ODPC and, where required, you, within the time limits set by law.</p>') +
      lsec('Changes', '<p>We may update this policy. The date below shows the latest version.</p>') },
    cookies: { title: 'Cookie Policy', desc: 'The cookies and browser storage used on palstravelleisure.co.ke, and how to change your choices.', body: () =>
      lsec('Our approach', '<p>We use only the browser storage this website needs to work. We do not use analytics, advertising or tracking cookies. Our fonts are hosted on our own website, so loading a page does not contact Google Fonts.</p>') +
      lsec('Strictly necessary storage', '<p>These items are stored in your browser and are not shared with anyone. They do not need consent.</p><div class="tablewrap"><table class="ltable"><thead><tr><th>Name</th><th>Purpose</th><th>Kept for</th></tr></thead><tbody>' +
        [['pals_consent', 'Remembers your cookie choices', '12 months'], ['pals_lang', 'Remembers the language you chose', 'Until you clear it'], ['pals_cur', 'Remembers the currency you chose', 'Until you clear it'], ['pals_sug', 'Remembers that you answered the language and currency suggestion', 'Until you clear it'], ['pals_rates', 'Caches exchange rates so prices load quickly', '12 hours'], ['pals_rl', 'Limits repeated form submissions, to stop spam', 'Until you close the browser']].map((r) => '<tr><td translate="no"><code>' + r[0] + '</code></td><td>' + r[1] + '</td><td>' + r[2] + '</td></tr>').join('') + '</tbody></table></div>') +
      lsec('Optional: maps', '<p>Hotel pages can show a Google Map with the route from Nairobi. The map is only loaded if you allow it. When it loads, Google may set its own cookies and receive your IP address. See <a href="https://policies.google.com/technologies/cookies" target="_blank" rel="noopener">how Google uses cookies</a>. If you do not allow maps, you can still open directions in Google Maps with the buttons on each hotel page.</p>') +
      lsec('Changing your choices', '<p><button type="button" class="btn sm line" data-consent="settings">Cookie settings</button></p><p>You can also clear this website’s data in your browser settings at any time.</p>') },
    terms: { title: 'Terms of Service', desc: 'The terms for using the Pals Travel & Leisure website and making enquiries.', body: () =>
      lsec('About these terms', '<p>These terms apply to your use of palstravelleisure.co.ke, run by ' + CO + ', Nandi Road, Karen, Nairobi, Kenya. By using the website you agree to them. Bookings are also covered by our <a href="#legal/bookings">Bookings and cancellations</a> terms and by the written confirmation we send you.</p>') +
      lsec('Information and prices', lul(['We work to keep information accurate, but descriptions, photos, availability and prices can change. Prices are indicative until we confirm them to you in writing.', 'Prices are set in Kenyan shillings (KES) unless stated otherwise. Amounts shown in other currencies are approximate conversions for guidance only; you pay the amount in the currency on your invoice.', 'Festive season packages are valid only for the dates shown and are subject to availability. Package pages are removed automatically when the offer ends.', 'If we find a clear error in a price, we will tell you before you pay and you can choose whether to go ahead.'])) +

      lsec('Our role and responsibility', '<p>For flights, hotels, lodges, train tickets and other services run by third parties, we arrange the booking on your behalf and the supplier’s own terms also apply. We are responsible for the services we provide directly, such as our own vehicles, drivers and coordination. Nothing in these terms limits any right you have under Kenyan law, including the Consumer Protection Act, 2012, or any liability that cannot legally be limited.</p>') +
      lsec('Events beyond our control', '<p>We are not responsible for failures or delays caused by events beyond our reasonable control, such as severe weather, natural disasters, strikes, civil unrest, epidemics or government action. If such an event affects your trip, we will help you with alternatives and pass on any refunds we receive from suppliers.</p>') +
      lsec('Website content and logos', '<p>Text and design on this website belong to Pals Travel &amp; Leisure. Hotel photos are used to show the properties we book and remain the property of their owners. Logos of partners and clients are shown to identify organisations we have worked with; they remain the property of their owners and do not mean those organisations endorse any particular trip. If you own content shown here and want it changed or removed, email <a href="mailto:info@palstravelleisure.co.ke">info@palstravelleisure.co.ke</a> and we will respond promptly.</p>') +
      lsec('Acceptable use', '<p>Please do not misuse the website: no spam or automated submissions, no attempts to break its security, and no copying of content for commercial use without permission.</p>') +
      lsec('Pals Ambassadors', '<p>Ambassadors must be 18 or over. Commission rates and payment terms are agreed in writing when you join. When you promote Pals, you must say clearly that you are a Pals Ambassador and may earn a commission, and you must not make promises about prices or services that we have not confirmed.</p>') +
      lsec('Links to other websites', '<p>We link to other websites, such as Google Maps and WhatsApp. We are not responsible for their content or privacy practices.</p>') +
      lsec('Complaints and governing law', '<p>If something goes wrong, tell us straight away so we can try to fix it, and email any complaint to <a href="mailto:info@palstravelleisure.co.ke">info@palstravelleisure.co.ke</a>. We aim to reply within five working days. These terms are governed by the laws of Kenya, and the courts of Kenya have jurisdiction, without affecting any consumer rights you have in your own country.</p>') },
    bookings: { title: 'Bookings, cancellations and refunds', desc: 'How bookings, payments, changes, cancellations and refunds work at Pals Travel & Leisure.', body: () =>
      lsec('Quotations', '<p>Every quotation shows what is included, the price, how long it is valid, the deposit and when the balance is due. Prices are confirmed only when we confirm your booking in writing.</p>') +
      lsec('Confirming and paying', lul(['Your booking is confirmed when we send written confirmation and receive the deposit stated in your quotation.', 'The balance is due by the date shown on your confirmation. If it is not paid on time, we may need to cancel the booking, and cancellation charges may apply.', '<b>Protect yourself from fraud:</b> we will never ask you to pay into a personal account or change our payment details by message. If in doubt, call us on +254 757 129 599 before paying.'])) +
      lsec('Changes', '<p>Tell us in writing if you want to change your booking. We will do our best to help. Suppliers may charge for changes, and we will tell you the cost before making any change.</p>') +

      F.fields.concat(CONTACT).forEach((x) => { if (req[x.k] !== undefined && String(req[x.k]) !== '') payload[x.label] = Array.isArray(req[x.k]) ? req[x.k].join(', ') : String(req[x.k]); });
      if (req.itemTitle) payload['Item'] = req.itemTitle; payload['Page'] = location.href; payload['Reference'] = req.id; if (req.childAges) payload['Children’s ages'] = req.childAges; payload['Consent'] = req.consent; payload['Email offers'] = req.marketing; payload['Language'] = LANG; if (CUR !== 'KES') payload['Currency shown'] = CUR;
      let ok = false;
      try {
        const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 15000);
        const r = await fetch('https://formsubmit.co/ajax/' + req.sendTo, { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify(payload), signal: ctl.signal });
        clearTimeout(tm); const j = await r.json().catch(() => ({})); ok = r.ok && String(j.success) === 'true';
      } catch (er) { ok = false; }
      S.sent = ok ? { key: kind + ':' + (itemId || ''), name: req.name, to: req.sendTo } : { key: kind + ':' + (itemId || ''), name: req.name, to: req.sendTo, fail: true, wa: 'https://wa.me/254722331204?text=' + encodeURIComponent(body), mail: 'mailto:' + req.sendTo + '?subject=' + encodeURIComponent(lines[0]) + '&body=' + encodeURIComponent(body) };
      f.removeAttribute('data-dirty'); render(); return;
    }
    const btn = f.querySelector('button[type="submit"]'); btn.disabled = true; btn.firstChild.textContent = T('Sending…') + ' ';
    try {
      if (FRAPPE) { await fx('pals_website.api.submit_request', { request: req }); if (S.canEdit) loadRequests(); }
      else {
        const ref = S.db.doc('bookings/' + S.uid); const snap = await ref.get(); const prev = snap.exists ? (snap.data().requests || []) : [];
        await ref.set({ requests: prev.concat([req]).slice(-50), updatedAt: req.createdAt });
      }
      S.sent = { key: kind + ':' + (itemId || ''), name: req.name, to: req.sendTo }; f.removeAttribute('data-dirty'); render();
    } catch (er) { btn.disabled = false; btn.firstChild.textContent = T('Send enquiry') + ' '; err.textContent = er.code === 429 ? T('Too many requests from this connection. Please WhatsApp us on +254 722 331 204.') : T('Could not send. Please try again or WhatsApp us.') + ' (' + (er.code || 'error') + ')'; }
  });

  // ---------- boot ----------
  if (/\/admin2\/?$/.test(location.pathname) && location.hash !== '#admin2') history.replaceState(null, '', location.pathname.replace(/admin2\/?$/, '') + '#admin2');
  applyLangAttrs();
  const boot = () => { renderFooter(); route(); tr($('#footer')); loadRates(); setTimeout(renderSuggest, 1200); };
  if (LANG === 'en') boot(); else Promise.race([loadLang(LANG), new Promise((r) => setTimeout(r, 2500))]).then(boot);
  (async () => {
    if (FRAPPE) {
      S.uid = 'guest';
      S.assets = { upload: async (file) => { const fd = new FormData(); fd.append('file', file, file.name); const m = await fx('pals_website.api.upload_image', fd); return { id: m.url }; } };
      await loadServer();
      setInterval(() => { if (S.canEdit && S.view === 'admin2' && !document.hidden) loadRequests().then(refresh); }, 60000);
      return;
    }
    if (STANDALONE) {
      S.standalone = true; S.uid = 'guest';
      fetch('data/addons.json').then((r) => r.ok ? r.json() : null).then((j) => { if (j && j.prices) { S.addons = j.prices; refresh(); } }).catch(() => {});
      try { const [t, v] = await Promise.all([fetch('data/tours.json').then((r) => r.json()), fetch('data/vehicles.json').then((r) => r.json())]); S.tours = t.sort((a, b) => (a.order || 0) - (b.order || 0)); S.cars = v.sort((a, b) => (a.order || 0) - (b.order || 0)); buildDyn(); S.ready = true; } catch (er) { S.offline = true; }
      render(); return;
    }
    const [db, user, assets] = await Promise.all([window.claude.use('db'), window.claude.use('user'), window.claude.use('assets')]);
    S.db = db; S.assets = assets;
    if (!db) { S.offline = true; render(); return; }
    S.uid = user ? await user.id() : null; S.canEdit = user ? await user.canEdit() : false;
    let n = 0; const ready = () => { n++; if (n >= 2) S.ready = true; refresh(); };
    db.doc('settings/addons').onSnapshot((d) => { S.addons = (d.exists && d.data().prices) || {}; refresh(); }, () => {});
    db.collection('packages').onSnapshot((q) => { setPackages(q.docs.map((d) => ({ id: d.id, ...d.data() }))); refresh(); }, () => {});
    db.collection('tours').orderBy('order').onSnapshot((s) => { S.tours = s.docs.map((d) => ({ id: d.id, ...d.data() })); buildDyn(); ready(); }, () => { S.offline = true; refresh(); });
    db.collection('vehicles').orderBy('order').onSnapshot((s) => { S.cars = s.docs.map((d) => ({ id: d.id, ...d.data() })); buildDyn(); ready(); }, () => { S.offline = true; refresh(); });
    if (S.canEdit) db.collection('bookings').onSnapshot((s) => { const all = []; s.docs.forEach((d) => (d.data().requests || []).forEach((r) => all.push({ ...r, owner: d.id }))); S.bookings = all; refresh(); }, () => {});
    render();
  })();
})();
</script>
