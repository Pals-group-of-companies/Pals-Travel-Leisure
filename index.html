<style>
:root{
  --bg:#FFFFFF; --soft:#F4F4F5; --card:#FFFFFF; --ink:#1F2124; --muted:#5E6165; --line:#E8E9EB; --red:#E61E28; --red2:#C3141D; --tint:#FDECED;
  --ok:#1E7A44; --oktint:#E3F3EA; --warn:#9A6200; --warntint:#FFF4D6; --input:#FFFFFF; --shadow:0 18px 50px rgba(20,22,24,.10);
  color-scheme: light;
}
html,:root[data-theme]{color-scheme:light;background:#fff}
html{color:#1F2124}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(90px + env(safe-area-inset-top,0px));scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--ink)} a:hover{color:var(--red2)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #1F6FD1;outline-offset:2px}
img{max-width:100%}
h1,h2,h3{letter-spacing:-.035em;line-height:1.08;margin:0;font-weight:800}
p{margin:0}
.wrap{max-width:1200px;margin:0 auto;padding:0 clamp(18px,4.5vw,32px)}
.muted{color:var(--muted)}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--red2);margin-bottom:12px}
.h2{font-size:clamp(30px,3.8vw,48px)}
.lead{font-size:clamp(16px,1.6vw,18px);color:var(--muted);line-height:1.65}
.center{text-align:center} .center .lead{margin-left:auto;margin-right:auto}
.sec{padding:clamp(64px,9vw,104px) 0}
.sec.soft{background:var(--soft)}
.view-home .sec.soft{background:#fff}
.head{max-width:720px;margin:0 auto 44px;text-align:center} .head .lead{margin-top:14px}
/* nav */
.navwrap{position:sticky;top:0;z-index:30;padding:14px clamp(12px,3vw,24px);transition:padding .3s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--soft)}
.nav{width:fit-content;max-width:100%;margin:0 auto;display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 18px;box-shadow:0 6px 24px rgba(20,22,24,.08);transition:box-shadow .3s}
.navwrap.scrolled .nav{box-shadow:0 10px 34px rgba(20,22,24,.14)}
.logo{display:inline-flex;align-items:center;padding-right:12px;margin-right:2px;border-right:1px solid var(--line)}
.logo img{height:28px;width:auto;display:block}
.links{display:flex;gap:0}
.links a{min-height:44px;display:inline-flex;align-items:center;padding:0 12px;border-radius:999px;text-decoration:none;font-size:14px;font-weight:500;color:var(--ink);transition:background .2s,color .2s;white-space:nowrap}
.links a:hover{background:var(--soft)}
.links a[aria-current="page"]{background:var(--tint);color:var(--red2);font-weight:700}
.navright{display:flex;gap:8px;align-items:center;margin-left:4px}
.burger{display:none;width:44px;height:44px;border-radius:999px;border:0;background:var(--soft);cursor:pointer;place-items:center}
.mpanel{display:none;max-width:420px;margin:8px auto 0;background:#fff;border:1px solid var(--line);border-radius:24px;padding:8px 16px 14px;box-shadow:0 10px 34px rgba(20,22,24,.12)}
@media (max-width:980px){ .nav{width:100%;justify-content:space-between} .links,.navright .btn-nav{display:none} .burger{display:grid} .mpanel.open{display:block} }
.mpanel a{display:flex;align-items:center;min-height:50px;padding:0 6px;border-bottom:1px solid var(--line);text-decoration:none;font-weight:600;font-size:17px}
.mpanel a:last-child{border-bottom:0}
.mpanel a[aria-current="page"]{color:var(--red2)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 24px;border-radius:999px;border:0;background:var(--red);color:#fff;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;transition:transform .2s,box-shadow .2s,background .2s;white-space:nowrap}
.btn:hover{color:#fff;transform:translateY(-1px);box-shadow:0 10px 24px rgba(230,30,40,.28)}
.btn:active{transform:translateY(0)}
.btn .arr{width:32px;height:32px;margin-right:-14px;border-radius:999px;background:#fff;color:var(--red);display:grid;place-items:center;transition:transform .25s}
.btn:hover .arr{transform:translateX(3px) rotate(-45deg)}
.btn.line{background:var(--card);color:var(--ink);border:1px solid var(--line)} .btn.line:hover{box-shadow:var(--shadow)}
.btn.sm{min-height:42px;padding:0 16px;font-size:14px}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}
.btn-nav{min-height:44px}
.ic{width:20px;height:20px;flex:0 0 auto}
/* icon tiles: duotone */
.tile{position:relative;width:56px;height:56px;border-radius:18px;background:var(--tint);display:grid;place-items:center;color:var(--red);flex:0 0 auto;overflow:hidden}
.tile::before{content:"";position:absolute;width:34px;height:34px;border-radius:999px;background:color-mix(in srgb,var(--red) 16%,transparent);right:-8px;bottom:-8px}
.tile svg{position:relative;width:26px;height:26px}
.itile{width:var(--s);height:var(--s);border-radius:calc(var(--s) * .3);background:var(--tint);display:grid;place-items:center;flex:0 0 auto;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.itile img{width:60%;height:60%;object-fit:contain}
.feature:hover .itile{transform:rotate(-4deg) scale(1.06)}
.tile.solid{background:var(--red);color:#fff} .tile.solid::before{background:rgba(255,255,255,.18)}
/* hero */
.hero{text-align:center;padding:clamp(36px,6vw,72px) 0 0}
.badge{display:inline-flex;align-items:center;gap:10px;padding:6px 16px 6px 6px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600}
.badge b{padding:4px 10px;border-radius:999px;background:var(--red);color:#fff;font-size:12px}
.hero h1{font-size:clamp(46px,8vw,120px);letter-spacing:-.055em;line-height:1.02;margin-top:24px}
.hero h1 span{color:var(--red)}
.hero .lead{max-width:560px;margin:22px auto 0}
.ctas{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:30px}
.stage{position:relative;max-width:760px;margin:12px auto 0;height:clamp(170px,26vw,320px)}
.stage svg.route{position:absolute;left:0;top:32%;width:100%;height:55%;overflow:visible}
.route path{stroke-dasharray:2 10;animation:dash 30s linear infinite}
@keyframes dash{to{stroke-dashoffset:-600}}
.jet{position:absolute;left:50%;top:0;width:min(86%,560px);transform:translateX(-50%);filter:drop-shadow(0 30px 28px rgba(20,22,24,.18));animation:fly 7s ease-in-out infinite}
@keyframes fly{0%,100%{transform:translateX(-50%) translateY(0) rotate(-1.5deg)}50%{transform:translateX(-50%) translateY(-16px) rotate(.5deg)}}
.strip{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px;margin-top:24px;padding:18px 0 28px;border-top:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(290px,100%),1fr));gap:20px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden;display:flex;flex-direction:column;transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.media{aspect-ratio:4/3;background:var(--soft);position:relative;display:grid;place-items:center;overflow:hidden}
.media img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.card:hover .media img{transform:scale(1.05)}
.media img.contain{object-fit:contain;width:86%;height:78%}
.chip-abs{position:absolute;top:12px;left:12px;background:#fff;color:#1F2124;font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px}
.cbody{padding:18px 20px 20px;display:flex;flex-direction:column;gap:6px;flex:1}
.meta{font-size:13px;color:var(--muted);font-weight:600}
.cbody h3{font-size:19px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cfoot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
.price{font-weight:800}
.panel{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:clamp(20px,3vw,30px)}
.feature{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px;transition:transform .35s,box-shadow .35s}
.feature:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.feature h3{font-size:18px;margin:18px 0 6px} .feature p{font-size:15px;color:var(--muted)}
.split{display:flex;flex-wrap:wrap;gap:40px 64px;align-items:center}
.split>*{flex:1 1 min(420px,100%)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 28px}
.chip{min-height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14px;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.chip[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.logos{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:24px 56px}
.logos img{height:46px;width:auto;filter:grayscale(1);opacity:.75;transition:filter .3s,opacity .3s}
.logos img:hover{filter:none;opacity:1}
.stat{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px}
.stat b{display:block;font-size:clamp(34px,4vw,48px);letter-spacing:-.05em;line-height:1}
.stat.red{background:var(--red);border-color:var(--red);color:#fff}
.pagehead{text-align:center;padding:clamp(40px,7vw,80px) 0 clamp(32px,5vw,56px)}
.pagehead h1{font-size:clamp(40px,6.4vw,84px);letter-spacing:-.05em}
.pagehead .lead{max-width:600px;margin:16px auto 0}
.crumb{font-size:13px;color:var(--muted);margin-bottom:14px}
.cover{border-radius:28px;overflow:hidden;aspect-ratio:21/8;background:var(--soft)} .cover img{width:100%;height:100%;object-fit:cover;display:block;animation:kb 26s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.1)}}
.list{list-style:none;margin:0;padding:0} .list li{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.pill{display:inline-flex;align-items:center;min-height:28px;padding:0 10px;border-radius:999px;background:var(--tint);color:var(--red2);font-size:12px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--oktint);color:var(--ok)} .pill.warn{background:var(--warntint);color:var(--warn)} .pill.grey{background:var(--soft);color:var(--muted)}
details{border-bottom:1px solid var(--line);padding:18px 2px} summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:12px} summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:22px;line-height:1;color:var(--red);transition:transform .25s} details[open] summary::after{transform:rotate(45deg)}
details p{margin-top:10px;color:var(--muted);font-size:15px}
/* forms */
.form{display:grid;gap:14px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.in{min-height:48px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:var(--input);width:100%;transition:border-color .2s,box-shadow .2s}
.in:focus{border-color:var(--red);box-shadow:0 0 0 4px var(--tint);outline:none}
textarea.in{padding:12px 14px;min-height:96px;resize:vertical}
fieldset{border:0;margin:0;padding:0} legend{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:8px;padding:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative;display:inline-flex;align-items:center;min-height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;color:var(--ink)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt:has(input:checked){background:var(--tint);border-color:var(--red);color:var(--red2)}
.opt:has(input:focus-visible){outline:3px solid #1F6FD1;outline-offset:2px}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:12px;padding:5px 5px 5px 14px;font-weight:600;font-size:14px;background:var(--input)}
.stepper .ctrl{display:flex;align-items:center;gap:8px}
.stepper button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:18px;display:grid;place-items:center}
.stepper input{width:44px;text-align:center;border:0;background:transparent;font-weight:800;-moz-appearance:textfield}
.stepper input::-webkit-inner-spin-button{display:none}
.formhead{display:flex;gap:14px;align-items:center;margin-bottom:4px}
.note{font-size:13px;color:var(--muted)}
.success{text-align:center;padding:24px 8px}
.success .tick{width:72px;height:72px;border-radius:999px;background:var(--tint);color:var(--red);display:grid;place-items:center;margin:0 auto;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
/* drawer */
.drawer{position:fixed;inset:0;z-index:50;background:rgba(10,10,12,.45);display:flex;justify-content:flex-end;animation:fade .25s}
.sheet{width:min(600px,100%);height:100%;overflow:auto;background:var(--bg);padding:22px clamp(18px,3vw,30px) calc(30px + env(safe-area-inset-bottom,0px));animation:slide .35s cubic-bezier(.2,.8,.2,1)}
@keyframes fade{from{opacity:0}} @keyframes slide{from{transform:translateX(40px);opacity:0}}
/* detail */
.detail{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start;margin:20px 0 80px}
.detail .main{flex:999 1 min(560px,100%);min-width:0}
.detail aside{flex:1 1 min(340px,100%);max-width:460px;position:sticky;top:96px}
@media (max-width:800px){.detail aside{position:static;max-width:none}}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:10px;margin-bottom:22px}
.gallery img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:18px;display:block}
/* admin */
.admin{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start;margin:8px 0 80px}
.side{flex:0 0 230px;max-width:100%;display:flex;flex-direction:column;gap:4px}
.side button{display:flex;align-items:center;gap:10px;min-height:46px;padding:0 14px;border-radius:12px;border:0;background:transparent;font-weight:600;cursor:pointer;text-align:left;color:var(--ink)}
.side button[aria-current="page"]{background:var(--tint);color:var(--red2)}
.side .count{margin-left:auto;font-size:12px;color:var(--muted)}
.amain{flex:1 1 min(600px,100%);min-width:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(160px,100%),1fr));gap:12px;margin-bottom:18px}
.tablewrap{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:780px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:12px 14px}
td{padding:10px 14px;border-top:1px solid var(--line);vertical-align:middle}
.thumb{width:58px;height:44px;border-radius:9px;object-fit:cover;background:var(--soft);display:block}
.bar{height:10px;border-radius:999px;background:var(--red);transition:width .8s cubic-bezier(.2,.7,.2,1)}
.track{background:var(--soft);border-radius:999px;height:10px}
.imgs{display:flex;flex-wrap:wrap;gap:8px} .imgs figure{margin:0;position:relative}
.imgs img{width:100px;height:76px;object-fit:cover;border-radius:10px;display:block;background:var(--soft)}
.imgs button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:999px;border:0;background:#fff;color:#C3141D;cursor:pointer;font-weight:800}
dl.kv{margin:0;display:grid;grid-template-columns:minmax(120px,38%) 1fr;gap:10px 16px} dl.kv dt{color:var(--muted);font-size:14px} dl.kv dd{margin:0;font-weight:600;word-break:break-word}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:60;animation:pop .3s}
/* footer */
.footer{background:var(--soft);padding:24px clamp(10px,2vw,24px)}

    if (t.dataset.edit && S.canEdit) { const [kind, id, field] = t.dataset.edit.split('|'); await patch(kind, id, { [field]: parse(field, t.value) }); }
    if (t.dataset.upload && S.assets && t.files && t.files[0]) {
      const [kind, id] = t.dataset.upload.split('|'); toast('Uploading…');
      try { const r = await S.assets.upload(t.files[0]); const list = kind === 'tours' ? S.tours : S.cars; const it = list.find((x) => x.id === id);
        await patch(kind, id, kind === 'tours' ? { images: [...(it.images || []), r.id] } : { image: r.id, fit: 'contain' }); } catch (err) { toast('Upload failed (' + (err.code || 'error') + ')'); }
    }
  });
  document.addEventListener('click', async (e) => {
    const el = e.target.closest('button, a, [data-close]'); if (!el) return; const d = el.dataset;
    if (el.id === 'burger') { const p = $('#mpanel'); p.classList.toggle('open'); el.setAttribute('aria-expanded', p.classList.contains('open')); el.setAttribute('aria-label', p.classList.contains('open') ? 'Close menu' : 'Open menu'); el.innerHTML = ic(p.classList.contains('open') ? 'x' : 'menu', 2); return; }
    if (d.step) { const inp = el.parentElement.querySelector('input'); const min = Number(inp.min || 0); inp.value = Math.max(min, (Number(inp.value) || 0) + Number(d.step)); inp.dispatchEvent(new Event('input', { bubbles: true })); return; }
    if ('logout' in d) { try { sessionStorage.removeItem('pals_admin'); } catch (er) {} S.authed = false; location.hash = 'home'; return; }
    if (d.filter) { S.filter = d.filter; render(); }
    if (d.tour) { if (S.view === 'safaris') { S.sub = d.tour; S.sent = null; render(); window.scrollTo(0, 0); } else { S.pendingSub = d.tour; location.hash = 'safaris'; } }
    if (d.car) { S.sub = d.car; S.sent = null; render(); window.scrollTo(0, 0); }
    if ('back' in d) { S.sub = null; render(); }
    if ('again' in d) { S.sent = null; render(); }
    if (d.request) { if (d.request === 'tour') { location.hash = 'safaris'; return; } if (d.request === 'car') { location.hash = 'cars'; return; } S.drawer = { type: 'request', kind: d.request }; S.sent = null; render(); }
    if (d.ckind) { S.contactKind = d.ckind; S.sent = null; render(); }
    if (d.atab) { S.atab = d.atab; render(); }
    if (d.bfilter) { S.bfilter = d.bfilter; render(); }
    if (d.booking) { const [owner, id] = d.booking.split('|'); S.drawer = { type: 'booking', owner, id }; render(); }
    if ('closebtn' in d || ('close' in d && e.target === el)) { S.drawer = null; render(); }
    if (d.status && S.drawer) { const ref = S.db.doc('bookings/' + S.drawer.owner); const snap = await ref.get(); if (snap.exists) { await ref.update({ requests: (snap.data().requests || []).map((r) => r.id === S.drawer.id ? { ...r, status: d.status } : r) }); toast('Status updated'); } }
    if (d.live) { const [kind, id] = d.live.split('|'); const it = (kind === 'tours' ? S.tours : S.cars).find((x) => x.id === id); await patch(kind, id, { live: it.live === false }); }
    if (d.del) { const [kind, id] = d.del.split('|'); if (confirm('Delete this from the website?')) { await S.db.doc(col(kind) + '/' + id).delete(); S.drawer = null; toast('Deleted'); render(); } }
    if (d.more) { const [kind, id] = d.more.split('|'); S.drawer = { type: 'item', kind, id }; render(); }
    if (d.rmimg) { const [kind, id, i] = d.rmimg.split('|'); const it = (kind === 'tours' ? S.tours : S.cars).find((x) => x.id === id); await patch(kind, id, kind === 'tours' ? { images: (it.images || []).filter((_, j) => j !== Number(i)) } : { image: '' }); }
    if (d.add) { const kind = d.add; const ref = S.db.collection(col(kind)).doc(); const order = Date.now();
      await ref.set(kind === 'tours' ? { title: 'New tour', days: '', region: '', category: 'lodge', price: null, currency: 'USD', overview: '', highlights: [], itinerary: [], images: [], live: false, order } : { name: 'New vehicle', type: '', seats: '', use: '', price: null, currency: 'KES', image: '', fit: 'contain', live: false, order });
      S.drawer = { type: 'item', kind, id: ref.id }; toast('Added, hidden until you make it visible'); render(); }
    if ('csv' in d) {
      const keys = ['createdAt', 'status', 'kind', 'itemTitle', 'name', 'phone', 'email', 'country']; Object.values(FORMS).forEach((F) => F.fields.forEach((f) => { if (keys.indexOf(f.k) === -1) keys.push(f.k); }));
      const csv = [keys.join(',')].concat(S.bookings.map((r) => keys.map((k) => '"' + String(Array.isArray(r[k]) ? r[k].join('; ') : (r[k] == null ? '' : r[k])).replace(/"/g, '""') + '"').join(','))).join('\n');
      const dl = await window.claude.use('downloads'); if (dl) { try { await dl.save({ filename: 'pals-requests.csv', data: csv }); } catch (err) { toast('Download cancelled'); } } else toast('Downloads are not available here');
    }
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.drawer) { S.drawer = null; render(); } });
  document.addEventListener('submit', async (e) => {
    const f = e.target;
    if (f.id === 'adminLogin') { e.preventDefault(); const fd = new FormData(f); if (String(fd.get('u')).trim() === 'admin' && String(fd.get('p')) === 'admin') { try { sessionStorage.setItem('pals_admin', '1'); } catch (er) { S.authed = true; } S.atab = 'overview'; render(); } else { f.querySelector('[data-err]').textContent = 'Wrong username or password.'; } return; }
    if (f.id === 'newsForm') { e.preventDefault(); toast('Thanks for subscribing'); f.reset(); return; }
    if (!f.dataset.form) return; e.preventDefault();
    const kind = f.dataset.form; const F = FORMS[kind]; const fd = new FormData(f); const err = f.querySelector('[data-err]');
    const missing = F.fields.concat(CONTACT).filter((x) => x.req && !String(fd.get(x.k) || '').trim());
    if (missing.length) { err.textContent = 'Please fill in: ' + missing.map((x) => x.label).join(', '); const first = f.querySelector('[name="' + missing[0].k + '"]'); if (first) first.focus(); return; }
    const itemId = f.dataset.item; const item = itemId ? (kind === 'tour' ? S.tours : S.cars).find((x) => x.id === itemId) : null;
    const req = { id: 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), kind, status: 'new', createdAt: new Date().toISOString(), itemId: itemId || '', itemTitle: item ? (item.title || item.name) : '', price: item && item.price != null ? item.price : null, currency: item ? (item.currency || (kind === 'tour' ? 'USD' : 'KES')) : '' };
    F.fields.concat(CONTACT).forEach((x) => { if (x.type === 'checks') req[x.k] = fd.getAll(x.k).map(String); else { const v = fd.get(x.k); if (v != null && v !== '') req[x.k] = x.type === 'stepper' ? Number(v) : String(v).slice(0, 2000); } });
    if (S.standalone) {
      const lines = ['New ' + (KIND_LABEL[kind] || kind) + ' request' + (req.itemTitle ? ': ' + req.itemTitle : '')].concat(F.fields.concat(CONTACT).filter((x) => req[x.k] !== undefined && String(req[x.k]) !== '').map((x) => x.label + ': ' + (Array.isArray(req[x.k]) ? req[x.k].join(', ') : req[x.k])));
      window.open('https://wa.me/254757129599?text=' + encodeURIComponent(lines.join('\n')), '_blank', 'noopener');
      S.sent = { key: kind + ':' + (itemId || ''), name: req.name }; f.removeAttribute('data-dirty'); render(); return;
    }
    const btn = f.querySelector('button[type="submit"]'); btn.disabled = true; btn.firstChild.textContent = 'Sending… ';
    try {
      const ref = S.db.doc('bookings/' + S.uid); const snap = await ref.get(); const prev = snap.exists ? (snap.data().requests || []) : [];
      await ref.set({ requests: prev.concat([req]).slice(-50), updatedAt: req.createdAt });
      S.sent = { key: kind + ':' + (itemId || ''), name: req.name }; f.removeAttribute('data-dirty'); render();
    } catch (er) { btn.disabled = false; btn.firstChild.textContent = 'Send request '; err.textContent = 'Could not send (' + (er.code || 'error') + '). Please try again or WhatsApp us.'; }
  });

  // ---------- boot ----------
  renderFooter(); route();
  (async () => {
    if (STANDALONE) {
      S.standalone = true; S.uid = 'guest';
      try { const [t, v] = await Promise.all([fetch('data/tours.json').then((r) => r.json()), fetch('data/vehicles.json').then((r) => r.json())]); S.tours = t.sort((a, b) => (a.order || 0) - (b.order || 0)); S.cars = v.sort((a, b) => (a.order || 0) - (b.order || 0)); S.ready = true; } catch (er) { S.offline = true; }
      render(); return;
    }
    const [db, user, assets] = await Promise.all([window.claude.use('db'), window.claude.use('user'), window.claude.use('assets')]);
    S.db = db; S.assets = assets;
    if (!db) { S.offline = true; render(); return; }
    S.uid = user ? await user.id() : null; S.canEdit = user ? await user.canEdit() : false;
    let n = 0; const ready = () => { n++; if (n >= 2) S.ready = true; refresh(); };
    db.collection('tours').orderBy('order').onSnapshot((s) => { S.tours = s.docs.map((d) => ({ id: d.id, ...d.data() })); ready(); }, () => { S.offline = true; refresh(); });
    db.collection('vehicles').orderBy('order').onSnapshot((s) => { S.cars = s.docs.map((d) => ({ id: d.id, ...d.data() })); ready(); }, () => { S.offline = true; refresh(); });
    if (S.canEdit) db.collection('bookings').onSnapshot((s) => { const all = []; s.docs.forEach((d) => (d.data().requests || []).forEach((r) => all.push({ ...r, owner: d.id }))); S.bookings = all; refresh(); }, () => {});
    render();
  })();
})();
</script>
